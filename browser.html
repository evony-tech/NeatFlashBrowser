<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="themes/chrome-like.css">
    <style>
    /* This removes the light background and styles the buttons correctly */
    .nav-ctrl-btn {
        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
        padding: 0 10px;
        height: 100%;
        font-size: 16px;
        outline: none;
        transition: background 0.2s;
    }

    .nav-ctrl-btn:hover {
        background-color: rgba(255, 255, 255, 0.1); /* Subtle hover effect */
    }

    /* Ensure the container is a flexbox so buttons stay on the right */
    #nav-body-ctrls {
        display: flex;
        flex-direction: row;
        align-items: center;
    }

    /* THE FIX: Hide ugly Chromium scrollbars from the UI menus! */
    ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
    }
</style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background-color: #202124; height: 100vh; display: flex; flex-direction: column;">

    <div id="flash-tabs" style="display: none;">
        <embed id="FlashTab1" src="about:blank#404" width="320" height="200"></embed>
        <embed id="FlashTab2" src="about:blank#404" width="320" height="200"></embed>
        <embed id="FlashTab3" src="about:blank#404" width="320" height="200"></embed>
    </div>

    <div id="overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; background-color: rgba(0,0,0,0.8);" onclick="document.getElementById('overlay').style.display='none'">

        <div onclick="event.stopPropagation()" style="background-color: #2b2b2b; padding: 30px; border-radius: 10px; width: 400px; color: white; font-family: sans-serif; box-shadow: 0px 0px 20px black; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-height: 80vh; overflow-y: auto;">
            
            <h2 style="margin-top: 0; text-align: center;">⚙️ Settings & Favorites</h2>
            <hr style="border: 1px solid #444; margin-bottom: 20px;">
            <button onclick="makeDefaultBrowser()" style="cursor:pointer; font-weight: bold; font-size: 14px; color: white; background: #0275d8; border: none; padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 5px;">🌐 Set default browser</button>
            <div style="margin-top: 15px; border-top: 1px solid #444; padding-top: 15px; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 15px;">
                <label style="color: #c9d1d9; font-weight: bold; font-size: 14px;">Select Secure (https) Browser:</label>
                <div style="margin-top: 8px;">
                    <select id="browser-dropdown" style="width: 100%; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; border-radius: 4px; outline: none; font-size: 13px;">
                        <option value="">-- No Browser Selected (HTTPS Blocked) --</option>
                        <option value="custom">📁 Browse for Custom Executable...</option>
                    </select>
                </div>
            </div>
            <div style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 15px;">
                <label style="color: #c9d1d9; font-weight: bold; font-size: 14px;">Proxy:</label>
                <div style="margin-top: 8px;">
                    <select id="proxy-dropdown" style="width: 100%; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; border-radius: 4px; outline: none; font-size: 13px;">
                        <option value="">-- No Proxy (Direct) --</option>
                    </select>
                </div>
                <div style="color: #888; font-size: 11px; margin-top: 6px; line-height: 1.4;">
                    Only routes this browser's own page loads through the proxy -- the game's own socket connection is unaffected.
                </div>
                <div id="manual-proxy-list" style="margin-top: 10px;"></div>
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                    <input id="manual-proxy-input" type="text" placeholder="host:port" style="flex: 1; min-width: 0; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; border-radius: 4px; outline: none; font-size: 13px;">
                    <button onclick="addManualProxy()" style="cursor:pointer; font-weight: bold; font-size: 13px; color: white; background: #0275d8; border: none; padding: 8px 12px; border-radius: 4px;">➕ Add</button>
                </div>
                <button onclick="importProxyList()" style="cursor:pointer; font-weight: bold; font-size: 13px; color: white; background: #17a2b8; border: none; padding: 8px; width: 100%; margin-top: 8px; border-radius: 4px;">📥 Import proxylist.txt</button>
            </div>
            <button onclick="dispachClearCache()" style="cursor:pointer; font-weight: bold; font-size: 14px; color: white; background: #d9534f; border: none; padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 5px;">🗑️ Clear Cache & Restart</button>
        
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button onclick="exportFavorites()" style="cursor:pointer; font-weight: bold; font-size: 14px; color: white; background: #17a2b8; border: none; padding: 10px; width: 50%; border-radius: 5px;">📤 Export</button>
                <button onclick="importFavorites()" style="cursor:pointer; font-weight: bold; font-size: 14px; color: white; background: #17a2b8; border: none; padding: 10px; width: 50%; border-radius: 5px;">📥 Import</button>
            </div>

            <button onclick="clearAllFavorites()" style="cursor:pointer; font-weight: bold; font-size: 14px; color: white; background: #f0ad4e; border: none; padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 5px;">⚠️ Clear All Favorites</button>
            
            <button onclick="document.getElementById('overlay').style.display='none'" style="cursor:pointer; font-weight: bold; font-size: 14px; color: white; background: #5cb85c; border: none; padding: 10px; width: 100%; border-radius: 5px;">✅ Close Menu</button>
            <div style="text-align: center; color: #888; font-size: 12px; margin-top: 25px; border-top: 1px solid #444; padding-top: 15px; line-height: 1.5;">
                
                <b style="color: #bbb; font-size: 14px;">Neat Flash Browser</b><br>
                <span id="app-version-display">Version: Loading...</span><br>
                Engineered for The NEAT Botfather by Evony-Tech<br>
                <div style="margin-top: 5px;">
                    <a href="#" onclick="openGitHubLink(event)" style="color: #58a6ff; text-decoration: none; font-size: 13px;">Check for updates on GitHub</a>
                </div>
            </div>
        </div>
    </div>
    <div id="fav-backdrop" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 998;" onclick="document.getElementById('fav-dropdown').style.display='none'; this.style.display='none';"></div>
    <div id="fav-dropdown" style="display: none; position: absolute; top: 40px; right: 100px; width: 260px; background-color: #2b2b2b; border: 1px solid #555; border-radius: 5px; box-shadow: 0px 5px 15px rgba(0,0,0,0.8); z-index: 1000; color: white; padding: 15px; max-height: 500px; overflow-y: auto;">
        <div id="fav-dropdown-content"></div>
    </div>

    <div id="neat-header" style="display: flex; flex-direction: row; align-items: center; background-color: #202124; height: 35px; -webkit-app-region: drag;">
        <div id="nav-body-tabs" style="flex: 1; height: 35px;"></div>
        
        <div id="window-controls" style="display: flex; flex-direction: row; height: 35px; -webkit-app-region: no-drag;">
            
            <div class="button" id="min-button" style="display: flex; align-items: center; justify-content: center; padding: 0 15px; cursor: pointer; height: 100%;">
                <img src="icons/min-w-10.png" draggable="false" style="width: 10px; height: 10px; object-fit: contain;" />
            </div>
            
            <div class="button" id="max-button" style="display: flex; align-items: center; justify-content: center; padding: 0 15px; cursor: pointer; height: 100%;">
                <img src="icons/max-w-10.png" draggable="false" style="width: 10px; height: 10px; object-fit: contain;" />
            </div>
            
            <div class="button" id="close-button" style="display: flex; align-items: center; justify-content: center; padding: 0 15px; cursor: pointer; height: 100%;">
                <img src="icons/close-w-10.png" draggable="false" style="width: 10px; height: 10px; object-fit: contain;" />
            </div>
            
        </div>
    </div>

    <div id="nav-body-ctrls" style="-webkit-app-region: no-drag;"></div>
    <div id="nav-body-views" style="flex: 1; background-color: #202124;"></div>

    <script>
        const { ipcRenderer, remote } = require('electron');
        const Store = require('./store');
        const store = new Store({ configName: 'user-preferences' });
        
        const controls = document.getElementById('nav-body-ctrls');
        const neatHeader = document.getElementById('neat-header');
        const win = remote.getCurrentWindow();

        // 1. Define the Button Tool (Transparent by default)
        function addControlBtn(icon, title, clickFn) {
            let btn = document.createElement("button");
            btn.className = 'nav-ctrl-btn'; 
            btn.innerHTML = icon;
            btn.title = title;
            btn.onclick = clickFn;
            controls.appendChild(btn);
            return btn;
        }

        // 2. Initialize Navigation (Address bar creates here)
        const enav = new (require('electron-navigation'))({
            defaultFavicons: true,
            newTabParams: ['http://neato3.com/neatflashbrowser', { icon: "clear", title: "Neat Flash Browser" }],
            newTabCallback: (url, options) => {
                options.webviewAttributes = { plugins: '' };
                options.postTabOpenCallback = webview => {
                    // 1. Guard the inner webview from Address Bar typing!
                    webview.addEventListener('will-navigate', (e) => {
                        if (e.url.toLowerCase().startsWith('https://')) {
                            webview.stop(); // Abort the load inside Flash
                            remote.require('./index').openSecureUrl(e.url); // Send to Bouncer
                        }
                    });

                    // 2. THE NEW FIX: Native Right-Click Context Menu
                    webview.addEventListener('context-menu', (e) => {
                        const { Menu, MenuItem } = remote;
                        const menu = new Menu();
                        
                        // If they highlighted text, give them the Copy option
                        if (e.params.selectionText) {
                            menu.append(new MenuItem({ label: 'Copy', role: 'copy' }));
                        }
                        
                        // If they right-clicked inside an input field, give them Cut/Paste
                        if (e.params.isEditable) {
                            menu.append(new MenuItem({ label: 'Cut', role: 'cut' }));
                            menu.append(new MenuItem({ label: 'Paste', role: 'paste' }));
                        }
                        
                        // Always give them Select All
                        menu.append(new MenuItem({ type: 'separator' }));
                        menu.append(new MenuItem({ label: 'Select All', role: 'selectAll' }));

                        // Only popup if there is actually something to show
                        if (menu.items.length > 1 || (menu.items.length === 1 && menu.items[0].type !== 'separator')) {
                            menu.popup({ window: remote.getCurrentWindow() });
                        }
                    });

                    // ==========================================
                    // 3. THE FIX: CONSISTENT READABLE STYLE FOR RAW DATA
                    // Checks the actual MIME type instead of the URL string!
                    // Uses a light background rather than a forced dark one --
                    // Chromium's built-in XML viewer applies its own
                    // syntax-highlight colors (tags, attributes, comments) that
                    // are tuned for a light background and aren't reachable by
                    // a simple body/pre color override, so forcing a dark
                    // background there just produces low-contrast text. A
                    // light background matches what that colorizer already
                    // expects, and reads just as well for plain JSON/text.
                    // ==========================================
                    webview.addEventListener('dom-ready', () => {
                        webview.executeJavaScript(`
                            (function() {
                                const type = document.contentType.toLowerCase();
                                if (type.includes('json') || type.includes('xml') || type.includes('plain')) {
                                    const style = document.createElement('style');
                                    style.textContent = 'html, body, pre { background-color: #fafafa !important; color: #1e1e1e !important; word-wrap: break-word; }';
                                    document.documentElement.appendChild(style);
                                }
                            })();
                        `);
                    });
                };
                return {options};
            }
        });

        // --- THE RENDERER BOUNCER: MONKEY PATCH ---
        const originalNewTab = enav.newTab;
        enav.newTab = function(url, options) {
            if (url && url.startsWith('https://')) {
                // FIX: Use the Smart Escape Pod instead of trusting Windows Shell
                remote.require('./index').openSecureUrl(url); 
                return; 
            }
            return originalNewTab.call(this, url, options);
        };

        // Show the generated home tab as "home.html" instead of its full
        // file:// disk path. electron-navigation sets the address bar via
        // `_updateUrl()` (a direct .value assignment, not user typing) on
        // every tab switch/navigation, so patch that the same way newTab is
        // patched above rather than trying to intercept every caller.
        const originalUpdateUrl = enav._updateUrl;
        enav._updateUrl = function (url) {
            originalUpdateUrl.call(this, url);
            const urlInput = document.getElementById('nav-ctrls-url');
            if (urlInput && /^file:.*\/home\.html$/i.test(urlInput.value)) {
                urlInput.value = 'home.html';
            }
        };

        // 3. CREATE BUTTONS (They appear AFTER the address bar on the right)
        addControlBtn('🏠', 'Set as Homepage', () => {
            let url = document.getElementById('nav-ctrls-url').value;
            if (url) remote.require('./index').sethome(url);
        });

        addControlBtn('⭐️', 'Favorites Menu', (e) => {
            let favMenu = document.getElementById('fav-dropdown');
            let backdrop = document.getElementById('fav-backdrop');
            if (favMenu.style.display === 'block') {
                favMenu.style.display = 'none';
                backdrop.style.display = 'none';
            } else {
                renderFavDropdown();
                favMenu.style.display = 'block';
                backdrop.style.display = 'block';
            }
            e.stopPropagation(); 
        });

        addControlBtn('➕', 'Zoom In', () => {
            let webview = document.querySelector('webview.active');
            if (webview) webview.setZoomFactor(webview.getZoomFactor() + 0.2);
        });

        addControlBtn('➖', 'Zoom Out', () => {
            let webview = document.querySelector('webview.active');
            if (webview) webview.setZoomFactor(webview.getZoomFactor() - 0.2);
        });

        addControlBtn('🤖', 'Open Botfather Dashboard', async () => {
            // Ping Botfather first so user gets a clear error if it's not running
            let alive = false;
            try { alive = await ipcRenderer.invoke('botfather-ping'); } catch(e) {}
            if (alive) {
                ipcRenderer.send('open-botfather-tab');
            } else {
                alert('\u26a0\ufe0f Botfather is not running on localhost:8025.\n\nPlease start TheNEATBotfather service first.');
            }
        });

        addControlBtn('🔳', 'FullScreen', toggleFullscreen);
        addControlBtn('\u2699\ufe0f', 'Settings', () => document.getElementById('overlay').style.display = 'block');

        // 4. THE HYBRID ROUTER
        const args = remote.process.argv;
        const urlArg = args.find(a => a.startsWith('--neat-url=') || a.startsWith('--url='));
        const titleArg = args.find(a => a.startsWith('--neat-title=') || a.startsWith('--title='));

        let passedUrl = urlArg ? decodeURIComponent(urlArg.replace(/--neat-url=|--url=/, '')) : (args.find(a => a.startsWith('http')) || 'none');
        let passedTitle = titleArg ? decodeURIComponent(titleArg.replace(/--neat-title=|--title=/, '')) : 'Neat Flash Browser';

        if (passedUrl !== "none" && passedUrl.startsWith('http://')) {
            enav.newTab(passedUrl, { title: passedTitle });
            
            // FIX: Only auto-save on initial boot if the strict Botfather flag was present
            if (urlArg) {
                saveToFavorites(passedUrl, passedTitle);
            }
        } else {
            // Local static page (README + latest GitHub Releases, baked in by
            // `npm run build-home`) instead of the live neato3.com/GitHub
            // page -- the browser can't navigate to its own https:// repo
            // itself, since the HTTPS Bouncer above ejects that navigation
            // straight back out to the OS browser.
            enav.newTab(`file://${__dirname}/home.html`, { icon: "clear", title: "Neat Flash Browser" });
        }

        // 5. TAB & FAVORITE UTILS
        ipcRenderer.on('open-new-tab', (event, data) => {
            const newUrl = data.url ? decodeURIComponent(data.url) : 'none';
            const newTitle = data.title ? decodeURIComponent(data.title) : 'Neat Flash Browser';
            
            // THE FIX: Whitelist "data:" so our Error Page can spawn!
            if (newUrl !== "none" && (newUrl.startsWith('http') || newUrl.startsWith('data:'))) {
                enav.newTab(newUrl, { title: newTitle });
                
                if (data.isBotfather && newUrl.startsWith('http')) {
                    saveToFavorites(newUrl, newTitle);
                }
            }
        });

        function saveToFavorites(url, title) {
            let favs = store.get('favorites');
            if (!Array.isArray(favs)) favs = []; // THE FIX: Prevent Object type crashes
            
            favs = favs.map(f => typeof f === 'string' ? { url: f, title: 'Saved Link' } : f);
            let existingIndex = favs.findIndex(f => f.url === url);
            if (existingIndex === -1) {
                favs.push({ url: url, title: title });
                store.set('favorites', favs);
            }
        }

        function renderFavDropdown() {
            let container = document.getElementById('fav-dropdown-content');
            container.innerHTML = ""; 
            
            let addBtn = document.createElement('button');
            addBtn.innerHTML = "➕ Add Current Tab";
            addBtn.style.cssText = "width: 100%; padding: 8px; background: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; font-weight: bold;";
            addBtn.onclick = () => {
                let activeTab = document.querySelector('webview.active');
                if (activeTab) saveToFavorites(activeTab.getURL(), activeTab.getTitle());
                renderFavDropdown();
            };
            container.appendChild(addBtn);

            let favs = store.get('favorites');
            if (!Array.isArray(favs)) favs = [];

            let groups = {};
            favs.forEach((fav, idx) => {
                let title = (typeof fav === 'string' ? 'Saved Link' : fav.title) || 'Saved Link';
                let server = "Other";
                let name = title;
                let match = title.match(/^\[(.*?)\]\s*(.*)$/);
                if (match) { server = match[1].toUpperCase(); name = match[2]; }
                if (!groups[server]) groups[server] = [];
                
                // THE FIX: We now pass the "fullTitle" so the edit box loads the brackets!
                groups[server].push({ url: fav.url, name: name, fullTitle: title, idx: idx });
            });

            for (let srv in groups) {
                let det = document.createElement('details');
                let sum = document.createElement('summary');
                sum.innerHTML = `📁 <b>${srv}</b>`;
                sum.style.cursor = "pointer";
                sum.style.padding = "6px";
                sum.style.backgroundColor = "#3a3a3a";
                sum.style.borderRadius = "3px";
                sum.style.userSelect = "none";
                det.appendChild(sum);
                
                let list = document.createElement('div');
                list.style.padding = "5px 0px 5px 15px";

                groups[srv].forEach(item => {
                    let itemDiv = document.createElement('div');
                    itemDiv.style.display = "flex";
                    itemDiv.style.justifyContent = "space-between";
                    itemDiv.style.alignItems = "center";
                    itemDiv.style.padding = "5px 0";
                    itemDiv.style.borderBottom = "1px solid #444";

                    let a = document.createElement('a');
                    a.innerHTML = item.name;
                    a.href = "#";
                    a.style.color = "#00BFFF";
                    a.style.textDecoration = "none";
                    a.style.flex = "1";
                    a.style.whiteSpace = "nowrap";
                    a.style.overflow = "hidden";
                    a.style.textOverflow = "ellipsis";
                    a.onclick = (e) => { 
                        e.preventDefault();
                        enav.newTab(item.url); 
                        document.getElementById('fav-dropdown').style.display='none'; 
                        document.getElementById('fav-backdrop').style.display='none';
                    };

                    // --- THE FIX: RENAME & DELETE BUTTONS ---
                    let editBtn = document.createElement('span');
                    editBtn.innerHTML = "✏️";
                    editBtn.style.cursor = "pointer";
                    editBtn.style.fontSize = "12px";
                    editBtn.style.marginLeft = "10px";
                    editBtn.title = "Rename Bookmark";
                    
                    let delBtn = document.createElement('span');
                    delBtn.innerHTML = "❌";
                    delBtn.style.cursor = "pointer";
                    delBtn.style.fontSize = "12px";
                    delBtn.style.marginLeft = "10px";
                    delBtn.title = "Delete Bookmark";
                    
                    let actionDiv = document.createElement('div');
                    actionDiv.appendChild(editBtn);
                    actionDiv.appendChild(delBtn);

                    // --- INLINE EDITOR LOGIC ---
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        a.style.display = 'none'; // Hide the link
                        actionDiv.style.display = 'none'; // Hide the buttons

                        let editContainer = document.createElement('div');
                        editContainer.style.display = 'flex';
                        editContainer.style.flex = '1';

                        let input = document.createElement('input');
                        input.type = 'text';
                        input.value = item.fullTitle; // Loads the full "[ss82] Name" string
                        input.style.flex = '1';
                        input.style.background = '#21262d';
                        input.style.color = '#c9d1d9';
                        input.style.border = '1px solid #30363d';
                        input.style.padding = '2px 5px';
                        input.style.outline = 'none';
                        input.style.borderRadius = '3px';

                        let saveBtn = document.createElement('button');
                        saveBtn.innerHTML = "💾";
                        saveBtn.style.background = 'none';
                        saveBtn.style.border = 'none';
                        saveBtn.style.cursor = 'pointer';
                        saveBtn.style.marginLeft = '5px';

                        let saveAction = () => {
                            let newTitle = input.value.trim();
                            if (newTitle !== "") {
                                let currentFavs = store.get('favorites') || [];
                                currentFavs[item.idx].title = newTitle;
                                store.set('favorites', currentFavs);
                                renderFavDropdown(); // Instantly rebuilds and categorizes!
                            }
                        };

                        saveBtn.onclick = (ev) => { ev.stopPropagation(); saveAction(); };
                        input.onkeypress = (ev) => { if (ev.key === 'Enter') saveAction(); };

                        editContainer.appendChild(input);
                        editContainer.appendChild(saveBtn);
                        itemDiv.insertBefore(editContainer, itemDiv.firstChild);
                        input.focus();
                    };

                    delBtn.onclick = () => {
                        let currentFavs = store.get('favorites') || [];
                        currentFavs.splice(item.idx, 1); 
                        store.set('favorites', currentFavs);
                        renderFavDropdown(); 
                    };

                    itemDiv.appendChild(a);
                    itemDiv.appendChild(actionDiv);
                    list.appendChild(itemDiv);
                });
                det.appendChild(list);
                container.appendChild(det);
            }
        }

        // 6. WINDOW CONTROLS
        document.getElementById('min-button').addEventListener('click', () => win.minimize());
        document.getElementById('max-button').addEventListener('click', () => {
            win.isMaximized() ? win.unmaximize() : win.maximize();
        });
        document.getElementById('close-button').addEventListener('click', () => win.close());

        // 7. FULLSCREEN SYNC
        let isFullScreen = false;
        function toggleFullscreen() {
            isFullScreen = !isFullScreen;
            ipcRenderer.send('fullScreen-click');
            neatHeader.style.display = isFullScreen ? "none" : "flex";
            controls.style.display = isFullScreen ? "none" : "block";
        }

        // 8. VERSION & SETTINGS
        document.getElementById('app-version-display').innerText = "Version " + remote.app.getVersion();
        window.dispachClearCache = () => ipcRenderer.send('clearChache-click');
        window.clearAllFavorites = () => remote.require('./index.js').removeAllFav();
        window.makeDefaultBrowser = () => {
            // 1. Injects the required Registry Keys so Windows knows this app is a browser
            remote.app.setAsDefaultProtocolClient('http');
            
            // 2. Safely open the Default Apps settings for each platform
            if (process.platform === 'win32') {
                remote.shell.openExternal('ms-settings:defaultapps');
            } else if (process.platform === 'darwin') {
                // Failsafe for Mac users trying to click it
                remote.dialog.showMessageBox(remote.getCurrentWindow(), {
                    type: 'info',
                    title: 'Mac OS',
                    message: 'Please go to System Preferences > General to change your default browser.'
                });
            } else if (process.platform === 'linux') {
                // Linux: use xdg-settings to set the default browser
                const { execFile } = require('child_process');
                execFile('xdg-settings', ['set', 'default-web-browser', 'neatflashbrowser.desktop'], (err) => {
                    if (err) {
                        remote.dialog.showMessageBox(remote.getCurrentWindow(), {
                            type: 'info',
                            title: 'Linux Default Browser',
                            message: 'To set Neat Flash Browser as default, run this command in your terminal:\n\nxdg-settings set default-web-browser neatflashbrowser.desktop'
                        });
                    }
                });
            }
        };
        // --- NEW: IMPORT / EXPORT FAVORITES ---
        window.exportFavorites = async () => {
            let favs = store.get('favorites');
            if (!Array.isArray(favs)) favs = [];
            
            if (favs.length === 0) {
                remote.dialog.showMessageBox({ type: 'info', title: 'Export', message: 'You have no favorites to export.' });
                return;
            }

            const result = await remote.dialog.showSaveDialog({
                title: 'Export Favorites',
                defaultPath: 'NeatFavorites.json',
                filters: [{ name: 'JSON Files', extensions: ['json'] }]
            });

            if (!result.canceled && result.filePath) {
                const fs = require('fs');
                fs.writeFileSync(result.filePath, JSON.stringify(favs, null, 2));
                remote.dialog.showMessageBox({ type: 'info', title: 'Export Successful', message: 'Favorites exported successfully!' });
            }
        };

        window.importFavorites = async () => {
            const result = await remote.dialog.showOpenDialog({
                title: 'Import Favorites',
                properties: ['openFile'],
                filters: [{ name: 'JSON Files', extensions: ['json'] }]
            });

            if (!result.canceled && result.filePaths.length > 0) {
                try {
                    const fs = require('fs');
                    const data = fs.readFileSync(result.filePaths[0], 'utf-8');
                    let importedFavs = JSON.parse(data);
                    
                    if (!Array.isArray(importedFavs)) throw new Error("Invalid file format. Expected a JSON array.");

                    let currentFavs = store.get('favorites');
                    if (!Array.isArray(currentFavs)) currentFavs = [];

                    let addedCount = 0;
                    importedFavs.forEach(f => {
                        let url = typeof f === 'string' ? f : f.url;
                        let title = typeof f === 'string' ? 'Saved Link' : (f.title || 'Saved Link');
                        
                        // Prevent exact URL duplicates from being imported
                        if (url && currentFavs.findIndex(ex => ex.url === url) === -1) {
                            currentFavs.push({ url: url, title: title });
                            addedCount++;
                        }
                    });

                    store.set('favorites', currentFavs);
                    if (typeof renderFavDropdown === 'function') renderFavDropdown(); // Refresh the UI behind the scenes
                    
                    remote.dialog.showMessageBox({ type: 'info', title: 'Import Successful', message: `Successfully imported ${addedCount} new favorites!` });
                } catch (err) {
                    remote.dialog.showErrorBox('Import Failed', 'Failed to parse file: ' + err.message);
                }
            }
        };

        // ==========================================
        // 9. SMART SECURE BROWSER AUTO-DETECTION
        // ==========================================
        const { dialog } = remote;
        const fs = require('fs');

        const RELEASES_URL = "https://github.com/evony-tech/NeatFlashBrowser/releases";

        window.openGitHubLink = async (e) => {
            e.preventDefault();
            const link = e.target;
            const originalText = link.textContent;
            link.textContent = 'Checking...';

            const result = await remote.require('./index').checkForUpdate();
            link.textContent = originalText;

            if (!result.ok) {
                // Couldn't reach GitHub's API directly -- fall back to the old
                // behavior of just opening the releases page.
                remote.require('./index').openSecureUrl(RELEASES_URL);
                return;
            }

            const current = remote.app.getVersion();
            const latest = (result.latest || '').replace(/^v/, '');

            if (latest && latest !== current) {
                const choice = remote.dialog.showMessageBoxSync(remote.getCurrentWindow(), {
                    type: 'info',
                    title: 'Update Available',
                    message: `A new version is available: ${result.latest} (you have v${current})`,
                    buttons: ['Open Release Page', 'Not Now']
                });
                if (choice === 0) remote.require('./index').openSecureUrl(result.url || RELEASES_URL);
            } else {
                remote.dialog.showMessageBox(remote.getCurrentWindow(), {
                    type: 'info',
                    title: 'Up to Date',
                    message: `You're running the latest version (v${current}).`
                });
            }
        };

        const browserDropdown = document.getElementById('browser-dropdown');
        let savedBrowserPath = store.get('secureBrowserPath') || '';

        // 1. Scan the OS for installed browsers
        function getCommonBrowsers() {
            const browsers = [];
            const isWin = process.platform === 'win32';
            const isMac = process.platform === 'darwin';
            const isLinux = process.platform === 'linux';

            if (isWin) {
                // THE FIX: Explicitly grab the 64-bit Program Files directory to bypass Windows 32-bit redirection!
                const prog64 = process.env.ProgramW6432;
                const prog32 = process.env['PROGRAMFILES(X86)'];
                const prog = process.env.PROGRAMFILES;
                const localAppData = process.env.LOCALAPPDATA;

                // Helper to dynamically build and deduplicate valid paths
                function buildPaths(suffix) {
                    let bases = [prog64, prog32, prog, localAppData].filter(Boolean);
                    return [...new Set(bases.map(b => b + suffix))];
                }

                const paths = {
                    'Google Chrome': buildPaths('\\Google\\Chrome\\Application\\chrome.exe'),
                    'Microsoft Edge': buildPaths('\\Microsoft\\Edge\\Application\\msedge.exe'),
                    'Mozilla Firefox': buildPaths('\\Mozilla Firefox\\firefox.exe'),
                    'Brave Browser': buildPaths('\\BraveSoftware\\Brave-Browser\\Application\\brave.exe')
                };

                for (const [name, possiblePaths] of Object.entries(paths)) {
                    for (const p of possiblePaths) {
                        if (p && fs.existsSync(p)) {
                            browsers.push({ name: name, path: p });
                            break;
                        }
                    }
                }
            } else if (isMac) {
                const paths = {
                    'Google Chrome': '/Applications/Google Chrome.app',
                    'Microsoft Edge': '/Applications/Microsoft Edge.app',
                    'Mozilla Firefox': '/Applications/Firefox.app',
                    'Safari': '/Applications/Safari.app'
                };
                for (const [name, p] of Object.entries(paths)) {
                    if (fs.existsSync(p)) {
                        browsers.push({ name: name, path: p });
                    }
                }
            } else if (isLinux) {
                // Linux: check common binary locations in PATH-like directories
                const { execFileSync } = require('child_process');
                const linuxBrowsers = [
                    { name: 'Google Chrome', bins: ['google-chrome', 'google-chrome-stable'] },
                    { name: 'Chromium',      bins: ['chromium', 'chromium-browser'] },
                    { name: 'Mozilla Firefox', bins: ['firefox'] },
                    { name: 'Brave Browser', bins: ['brave-browser', 'brave'] },
                    { name: 'Microsoft Edge', bins: ['microsoft-edge', 'microsoft-edge-stable'] },
                ];
                const searchDirs = ['/usr/bin', '/usr/local/bin', '/snap/bin', '/opt/google/chrome'];

                for (const b of linuxBrowsers) {
                    let found = null;
                    outer: for (const dir of searchDirs) {
                        for (const bin of b.bins) {
                            const p = dir + '/' + bin;
                            if (fs.existsSync(p)) { found = p; break outer; }
                        }
                    }
                    // Also try `which` as a fallback
                    if (!found) {
                        for (const bin of b.bins) {
                            try {
                                const result = execFileSync('which', [bin], { encoding: 'utf8' }).trim();
                                if (result) { found = result; break; }
                            } catch(e) {}
                        }
                    }
                    if (found) browsers.push({ name: b.name, path: found });
                }

                // Always offer xdg-open as a safe fallback on Linux
                try {
                    const xdg = execFileSync('which', ['xdg-open'], { encoding: 'utf8' }).trim();
                    if (xdg) browsers.push({ name: 'System Default (xdg-open)', path: xdg });
                } catch(e) {}
            }
            return browsers;
        }

        // 2. Populate the Dropdown Menu
        function populateDropdown() {
            const detectedBrowsers = getCommonBrowsers();
            
            // Clear old options (keep the first 'Empty' and last 'Custom' options)
            while (browserDropdown.options.length > 2) {
                browserDropdown.remove(1);
            }

            // Inject detected browsers
            detectedBrowsers.reverse().forEach(b => {
                let opt = document.createElement('option');
                opt.value = b.path;
                opt.text = `🌐 ${b.name}`;
                browserDropdown.add(opt, 1);
            });

            // If their saved path is custom, inject it so the dropdown selects it
            if (savedBrowserPath) {
                let pathExists = Array.from(browserDropdown.options).some(opt => opt.value === savedBrowserPath);
                if (!pathExists && savedBrowserPath !== 'custom') {
                    let opt = document.createElement('option');
                    opt.value = savedBrowserPath;
                    opt.text = `🔧 Custom Executable`;
                    browserDropdown.add(opt, browserDropdown.options.length - 1);
                }
                browserDropdown.value = savedBrowserPath;
            } else {
                browserDropdown.value = "";
            }
        }

        populateDropdown();

        // 3. Handle User Selection
        browserDropdown.addEventListener('change', async (e) => {
            const selectedVal = e.target.value;

            if (selectedVal === 'custom') {
                const isWin = process.platform === 'win32';
                const isMac = process.platform === 'darwin';
                const filters = [];
                if (isWin) filters.push({ name: 'Browser Executable', extensions: ['exe'] });
                else if (isMac) filters.push({ name: 'Mac Application', extensions: ['app'] });

                // THE FIX: Remove 'remote.getCurrentWindow()' to prevent IPC freezing on certain Windows builds!
                const result = await dialog.showOpenDialog({
                    properties: ['openFile'],
                    filters: filters
                });

                if (!result.canceled && result.filePaths.length > 0) {
                    savedBrowserPath = result.filePaths[0];
                    store.set('secureBrowserPath', savedBrowserPath);
                    populateDropdown(); // Refresh UI to show the new custom file
                } else {
                    browserDropdown.value = savedBrowserPath || ""; // Revert if cancelled
                }
            } else {
                savedBrowserPath = selectedVal;
                store.set('secureBrowserPath', savedBrowserPath);
            }
        });

        // ==========================================
        // 10. PROXY SELECTION (Botfather's own Proxies table + our own manual list)
        // ==========================================
        const proxyDropdown = document.getElementById('proxy-dropdown');
        let savedProxy = store.get('selectedProxy') || '';

        // Required directly (this window has nodeIntegration: true), not via
        // remote.require -- Electron 9's legacy remote module doesn't reliably
        // proxy async/Promise-returning calls across to the main process.
        const { getProxies } = require('./proxies');

        // "host:port" -- same bare format Botfather's own Proxies table uses.
        const PROXY_ADDRESS_RE = /^[\w.\-]+:\d{2,5}$/;

        function getManualProxies() {
            let list = store.get('manualProxies');
            return Array.isArray(list) ? list : [];
        }

        function setManualProxies(list) {
            store.set('manualProxies', list);
            renderManualProxyList();
            populateProxyDropdown();
        }

        async function populateProxyDropdown() {
            let botfatherProxies = [];
            try {
                botfatherProxies = await getProxies();
            } catch (err) {
                console.error('Failed to load proxies from Botfather:', err);
            }
            const manualProxies = getManualProxies();

            while (proxyDropdown.options.length > 1) proxyDropdown.remove(1);

            // One flat list -- Botfather's proxies (if any were found) plus
            // whatever the user's added manually. No need to distinguish the
            // source: if Botfather's list is empty the user just adds their
            // own, and if it isn't they may not need to add any at all.
            const addresses = [...botfatherProxies.map(p => p.address), ...manualProxies];
            addresses.forEach(address => {
                let opt = document.createElement('option');
                opt.value = address;
                opt.text = `🌍 ${address}`;
                proxyDropdown.add(opt);
            });

            // If the saved proxy no longer exists in either list (deleted, or
            // Botfather's DB isn't reachable right now), still show it so the
            // selection isn't silently lost.
            if (savedProxy && !Array.from(proxyDropdown.options).some(o => o.value === savedProxy)) {
                let opt = document.createElement('option');
                opt.value = savedProxy;
                opt.text = `🌍 ${savedProxy} (not in the list)`;
                proxyDropdown.add(opt);
            }

            proxyDropdown.value = savedProxy;
        }

        populateProxyDropdown();

        proxyDropdown.addEventListener('change', (e) => {
            savedProxy = e.target.value;
            store.set('selectedProxy', savedProxy);
            remote.require('./index').applyProxy(savedProxy);
        });

        // --- Manual proxy list: add / inline edit / delete ---
        function renderManualProxyList() {
            let container = document.getElementById('manual-proxy-list');
            container.innerHTML = "";
            let proxies = getManualProxies();

            proxies.forEach((address, idx) => {
                let row = document.createElement('div');
                row.style.cssText = "display:flex; align-items:center; justify-content:space-between; background:#21262d; border:1px solid #30363d; border-radius:4px; padding:6px 8px; margin-bottom:4px; font-size:12px;";

                let text = document.createElement('span');
                text.textContent = address;
                text.style.cssText = "overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;";

                let actions = document.createElement('span');
                actions.style.cssText = "flex-shrink:0; margin-left: 8px;";

                let editBtn = document.createElement('span');
                editBtn.innerHTML = "✏️";
                editBtn.title = "Edit";
                editBtn.style.cssText = "cursor:pointer; margin-left:8px;";

                let delBtn = document.createElement('span');
                delBtn.innerHTML = "❌";
                delBtn.title = "Remove";
                delBtn.style.cssText = "cursor:pointer; margin-left:8px;";

                editBtn.onclick = () => {
                    text.style.display = 'none';
                    actions.style.display = 'none';

                    let input = document.createElement('input');
                    input.type = 'text';
                    input.value = address;
                    input.style.cssText = "flex:1; background:#161b22; color:#c9d1d9; border:1px solid #30363d; padding:2px 5px; outline:none; border-radius:3px; font-size:12px;";

                    let saveBtn = document.createElement('span');
                    saveBtn.innerHTML = "💾";
                    saveBtn.style.cssText = "cursor:pointer; margin-left:8px;";

                    let saveAction = () => {
                        let val = input.value.trim();
                        if (!PROXY_ADDRESS_RE.test(val)) {
                            remote.dialog.showMessageBox({ type: 'warning', title: 'Invalid Proxy', message: 'Expected "host:port", e.g. 192.168.1.1:8080.' });
                            return;
                        }
                        let list = getManualProxies();
                        list[idx] = val;
                        setManualProxies(list);
                    };
                    saveBtn.onclick = saveAction;
                    input.onkeypress = (ev) => { if (ev.key === 'Enter') saveAction(); };

                    row.insertBefore(input, row.firstChild);
                    row.appendChild(saveBtn);
                    input.focus();
                };

                delBtn.onclick = () => {
                    let list = getManualProxies();
                    list.splice(idx, 1);
                    setManualProxies(list);
                };

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                row.appendChild(text);
                row.appendChild(actions);
                container.appendChild(row);
            });
        }

        window.addManualProxy = () => {
            let input = document.getElementById('manual-proxy-input');
            let val = input.value.trim();
            if (!PROXY_ADDRESS_RE.test(val)) {
                remote.dialog.showMessageBox({ type: 'warning', title: 'Invalid Proxy', message: 'Expected "host:port", e.g. 192.168.1.1:8080.' });
                return;
            }
            let list = getManualProxies();
            if (!list.includes(val)) list.push(val);
            setManualProxies(list);
            input.value = '';
        };

        // Reads one proxy per line ("host:port"); blank lines and "#" comments
        // are skipped, malformed lines are silently dropped rather than
        // blocking the whole import.
        window.importProxyList = async () => {
            const result = await remote.dialog.showOpenDialog({
                title: 'Import proxylist.txt',
                properties: ['openFile'],
                filters: [{ name: 'Text Files', extensions: ['txt'] }, { name: 'All Files', extensions: ['*'] }]
            });

            if (result.canceled || !result.filePaths.length) return;

            const fs = require('fs');
            let lines;
            try {
                lines = fs.readFileSync(result.filePaths[0], 'utf-8').split(/\r?\n/);
            } catch (err) {
                remote.dialog.showMessageBox({ type: 'error', title: 'Import Failed', message: 'Could not read that file: ' + err.message });
                return;
            }

            let list = getManualProxies();
            let addedCount = 0;
            lines.forEach(line => {
                let val = line.trim();
                if (!val || val.startsWith('#')) return;
                if (PROXY_ADDRESS_RE.test(val) && !list.includes(val)) {
                    list.push(val);
                    addedCount++;
                }
            });

            setManualProxies(list);
            remote.dialog.showMessageBox({ type: 'info', title: 'Import Complete', message: `Imported ${addedCount} new prox${addedCount === 1 ? 'y' : 'ies'}.` });
        };

        renderManualProxyList();

        // ==========================================
        // 11. ADDRESS BAR: GAME SERVER AUTOFILL
        // ==========================================
        // Typing a server code ("ss78." or just "78.") offers an inline
        // completion of the actual game domain, the same way a normal
        // browser omnibox completes a bare hostname. electron-navigation
        // creates the address bar input itself (id="nav-ctrls-url") rather
        // than us, so this listens via delegation on document instead of
        // grabbing a direct element reference that may not exist yet.
        // The suggested part is left selected so continued typing just
        // replaces it, matching standard address-bar autocomplete behavior.
        document.addEventListener('input', (e) => {
            if (!e.target || e.target.id !== 'nav-ctrls-url') return;
            const input = e.target;
            if (/^(ss)?\d+\.$/i.test(input.value)) {
                const start = input.value.length;
                input.value += 'evony.com';
                // Setting .value directly doesn't fire a native 'input' event,
                // so electron-navigation's own address-bar listener (registered
                // before this one) never sees the appended suggestion and keeps
                // its last-known value from before the "." keystroke -- Enter
                // would submit that stale value and need a second press once
                // the library catches up. Dispatch one so it re-reads the real
                // value immediately, same tick.
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.setSelectionRange(start, input.value.length);
            }
        });
    </script>
    </body>
</html>
